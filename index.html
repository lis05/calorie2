<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#141722" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Calorie</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="stylesheet" href="./src/css/variables.css" />
  <link rel="stylesheet" href="./src/css/app.css" />
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="app-header">
      <div class="app-title">
        <span style="font-size:1.35rem;">🥗</span>
        <span>Calorie</span>
      </div>
      <div class="date-selector" id="header-date-selector">
        <button id="prev-day-btn" class="icon-btn" aria-label="Previous day">‹</button>
        <span id="current-date-display">Сьогодні</span>
        <button id="next-day-btn" class="icon-btn" aria-label="Next day">›</button>
      </div>
    </header>

    <!-- Dynamic View Content -->
    <main id="view-content" class="view-container"></main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span id="nav-label-dashboard">Підсумок</span>
      </button>
      <button class="nav-item" data-tab="analytics">
        <span class="nav-icon">📈</span>
        <span id="nav-label-analytics">Графік</span>
      </button>
      <button class="nav-item" data-tab="logMeal">
        <span class="nav-icon">➕</span>
        <span id="nav-label-log">Запис</span>
      </button>
      <button class="nav-item" data-tab="foodDb">
        <span class="nav-icon">📖</span>
        <span id="nav-label-fooddb">Продукти</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-icon">⚙️</span>
        <span id="nav-label-settings">Опції</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
